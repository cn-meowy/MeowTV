name: meowtv_mobile
description: "MeowTV Mobile App"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  dio: ^5.8.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  path_provider: ^2.1.6

  # Secure storage (Keychain / EncryptedSharedPreferences)
  flutter_secure_storage: ^10.3.1

  # Fallback storage when Keychain is unavailable (e.g. ad-hoc signing on macOS)
  shared_preferences: ^2.5.3

  # State management
  flutter_riverpod: ^2.6.1

  # Video player
  video_player: ^2.13.0
  chewie: ^1.14.1

  # Connectivity (network type detection)
  connectivity_plus: ^6.0.5

  # Device info (emulator detection via Android Build)
  device_info_plus: ^13.1.0

  # App info
  package_info_plus: ^10.1.0

  # Logging
  logger: ^2.5.0
  # Casting (Chromecast / AirPlay / DLNA) with built-in HTTP media proxy.
  # 上游 dart_cast 0.6.0 的 MediaProxy 在 HLS/字幕重写门槛处要求
  # statusCode == 200，当 DLNA 渲染器（libmpv）发 Range 头导致上游返回 206
  # 时重写被跳过，原始 m3u8 相对路径透传给 TV → 404 死循环。使用本地补丁
  # 版本接受 206 并在重写后强制 200，见 third_party/dart_cast/LOCAL_PATCHES.md。
  dart_cast:
    path: ./third_party/dart_cast
  # mDNS 多播组播客户端：dart_cast 间接依赖。app 启动期 LocalNetworkProbe
  # 直接用它发一次无害探针，触发 iOS 14+ "本地网络"系统授权弹窗。
  multicast_dns: ^0.3.2+6
  http: ^1.2.0

  # QR code scanner (camera)
  mobile_scanner: ^7.0.0

  # SVG rendering
  flutter_svg: ^2.0.17

  # Screen brightness control (gesture adjustment in player)
  screen_brightness: ^2.1.0

  # Volume control (system volume gesture adjustment in player)
  volume_controller: ^3.0.0

  # Picture-in-Picture (Android + iOS)
  # 上游 fl_pip 3.2.3 在 Flutter ≥ 3.27 下编译失败（FlutterViewController.engine 已改为非可选），
  # 维护者尚未发布修复（见 Wayaer/fl_pip#33）。使用本地补丁版本，见 third_party/fl_pip/LOCAL_PATCHES.md。
  fl_pip:
    path: ./third_party/fl_pip

  # XML parsing (Bilibili danmaku XML)
  xml: ^6.5.0

  # Save to gallery
  gal: ^2.3.0

  # Share functionality
  share_plus: ^13.2.1

  # FFmpeg video processing
  # NOTE: 原 ffmpeg_kit_flutter 6.0.3 的 arthenica/ffmpeg-kit 仓库已归档，
  # GitHub Release 上的 xcframework 预编译包全部 404，导致 iOS/macOS pod install 失败。
  # 替换为社区维护 fork ffmpeg_kit_flutter_new，Dart API 完全兼容，二进制源指向新仓库。
  ffmpeg_kit_flutter_new: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
#  dart run change_app_package_name:main cn.meowy.meowtv
  change_app_package_name: ^1.5.0
#   dart run rename_app:main all="MeowTV"
  rename_app: ^1.6.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
