org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=true
# JDK 由构建环境提供 (CI 用 actions/setup-java; 本机可在 gradle-local.properties 覆盖)
# 推荐 JDK 17 (JDK 25 与 Kotlin 2.2.x 的 JavaVersion.parse 不兼容)
# Increase timeout for slow network environments
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
# Enable parallel builds
org.gradle.parallel=true
# Disable configuration cache (incompatible with Kotlin plugin)
org.gradle.configuration-cache=false
