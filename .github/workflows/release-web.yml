# ============================================================
# MeowTV Release Web 工作流 (Web 前端 Nginx Docker 镜像)
#
# 触发方式:
#   1. 推送 tag web/v* (如 web/v1.2.3) -> 自动发版
#   2. workflow_dispatch 手动触发          -> 可输入版本号
#
# 产物:
#   - Web 前端 Docker 镜像  xiaosheng078/meowtv-web -> GHCR + DockerHub (amd64,arm64)
#
# 必需 Secrets:
#   DOCKER_USERNAME  DockerHub 用户名
#   DOCKER_PASSWORD  DockerHub Access Token (推荐) 或密码
# GHCR 使用内置 GITHUB_TOKEN, 无需额外配置。
# ============================================================

name: Release Web

on:
  push:
    tags:
      - 'web/v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空则从 git tag 或 pubspec.yaml 读取)'
        required: false
        type: string

permissions:
  packages: write   # 推送 GHCR 镜像 (无需 contents:write, 不创建 Release)

jobs:
  # ----------------------------------------------------------
  # 版本号解析: tag -> 去掉 web/v 前缀; dispatch -> 输入或回退 pubspec
  # ----------------------------------------------------------
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version & tag
        id: out
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#*/v}"
          else
            INPUT_VER="${{ inputs.version }}"
            INPUT_VER="${INPUT_VER#v}"
            if [ -n "$INPUT_VER" ]; then
              VERSION="$INPUT_VER"
            else
              # 回退: 读取 pubspec.yaml version 字段 (取 + 前部分)
              VERSION=$(grep '^version:' frontend/app/pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
            fi
            TAG="web/v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "解析结果: version=${VERSION} tag=${TAG}"

  # ----------------------------------------------------------
  # Web 前端 Docker 镜像 (React + Vite + Nginx)
  # ----------------------------------------------------------
  docker-web:
    name: Docker Web
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/frontend/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/meowtv-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/meowtv-web:${{ needs.resolve-version.outputs.version }}
            docker.io/xiaosheng078/meowtv-web:latest
            docker.io/xiaosheng078/meowtv-web:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
