# ============================================================
# MeowTV Release 工作流
#
# 触发方式:
#   1. 推送 tag v* (如 v1.2.3)        -> 自动发版
#   2. workflow_dispatch 手动触发      -> 可输入版本号、跳过开关
#
# 产物:
#   - 后端 Docker 镜像  xiaosheng078/meowtv      -> GHCR + DockerHub (amd64,arm64)
#   - Web 前端 Docker 镜像  xiaosheng078/meowtv-web -> GHCR + DockerHub (amd64,arm64)
#   - Flutter App (Android/macOS/Windows)        -> GitHub Release 附件
#
# 必需 Secrets:
#   DOCKER_USERNAME  DockerHub 用户名
#   DOCKER_PASSWORD  DockerHub Access Token (推荐) 或密码
# GHCR 使用内置 GITHUB_TOKEN, 无需额外配置。
#
# iOS 暂未包含 (需苹果开发者证书, 见 docs/ios-device-signing.md)。
# ============================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空则从 git tag 或 pubspec.yaml 读取)'
        required: false
        type: string
      skip_docker:
        description: '跳过 Docker 镜像构建'
        required: false
        type: boolean
        default: false
      skip_flutter:
        description: '跳过 Flutter App 构建'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 创建 Release、上传资源
  packages: write   # 推送 GHCR 镜像

jobs:
  # ----------------------------------------------------------
  # 版本号解析: tag -> 去掉 v 前缀; dispatch -> 输入或回退 pubspec
  # ----------------------------------------------------------
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version & tag
        id: out
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            INPUT_VER="${{ inputs.version }}"
            if [ -n "$INPUT_VER" ]; then
              VERSION="$INPUT_VER"
            else
              # 回退: 读取 pubspec.yaml version 字段 (取 + 前部分)
              VERSION=$(grep '^version:' frontend/app/pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
            fi
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "解析结果: version=${VERSION} tag=${TAG}"

  # ----------------------------------------------------------
  # 后端 Docker 镜像 (Go)
  # ----------------------------------------------------------
  docker-backend:
    name: Docker Backend
    needs: resolve-version
    if: ${{ github.event_name == 'push' || !inputs.skip_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend/
          file: scripts/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/meowtv:latest
            ghcr.io/${{ steps.owner.outputs.name }}/meowtv:${{ needs.resolve-version.outputs.version }}
            docker.io/xiaosheng078/meowtv:latest
            docker.io/xiaosheng078/meowtv:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ----------------------------------------------------------
  # Web 前端 Docker 镜像 (React + Vite + Nginx)
  # ----------------------------------------------------------
  docker-web:
    name: Docker Web
    needs: resolve-version
    if: ${{ github.event_name == 'push' || !inputs.skip_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/frontend/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/meowtv-web:latest
            ghcr.io/${{ steps.owner.outputs.name }}/meowtv-web:${{ needs.resolve-version.outputs.version }}
            docker.io/xiaosheng078/meowtv-web:latest
            docker.io/xiaosheng078/meowtv-web:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ----------------------------------------------------------
  # Flutter App 构建 (Android / macOS / Windows)
  # 矩阵: 每端用原生 runner, 因 Flutter 桌面端无法交叉编译
  # ----------------------------------------------------------
  flutter-build:
    name: Flutter ${{ matrix.target }}
    needs: resolve-version
    if: ${{ github.event_name == 'push' || !inputs.skip_flutter }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            script_path: scripts/frontend/app/build_app.sh
            script_args: android fat
          - os: macos-latest
            target: macos
            script_path: scripts/frontend/macos/build_macos.sh
            script_args: ""
          - os: windows-latest
            target: windows
            script_path: scripts/frontend/windows/build_windows.sh
            script_args: --arch x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Windows: ffmpeg_kit_flutter_new 的 .plugin_symlinks 需要 symlink 支持
          set-symlinks: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup JDK 17 (Android)
        # Kotlin 2.2.x 的 JavaVersion.parse 与 JDK 25 不兼容, 固定 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (Android)
        # build.gradle.kts 声明 NDK 29.0.14033849, 需预接受 license
        if: matrix.target == 'android'
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Disable Swift Package Manager (macOS)
        # ffmpeg_kit_flutter 等二进制依赖的 SPM checksum 与 manifest 不匹配,
        # Flutter 新版默认启用实验性 SPM 集成导致 Xcode 解析失败;
        # 关闭 SPM 回退到 CocoaPods (官方推荐临时方案)
        if: matrix.target == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - name: Make build script executable
        # git checkin 不保留 +x 位, 统一 chmod
        shell: bash
        run: chmod +x "${{ matrix.script_path }}"

      - name: Sync version to pubspec.yaml
        # 将 tag 版本号写入 pubspec.yaml, 保留 build number (+1)
        # 这样三个 build 脚本读出的 version 与 Release/Docker tag 一致
        shell: bash
        run: |
          python3 - <<EOF
          import re, io
          p = "frontend/app/pubspec.yaml"
          ver = "${{ needs.resolve-version.outputs.version }}"
          with open(p, encoding="utf-8") as f:
              s = f.read()
          s = re.sub(r"^version: .+", f"version: {ver}+1", s, count=1, flags=re.M)
          with open(p, "w", encoding="utf-8") as f:
              f.write(s)
          print("::group::pubspec.yaml version")
          for line in s.splitlines():
              if line.startswith("version:"):
                  print(line)
          print("::endgroup::")
          EOF

      - name: Build ${{ matrix.target }}
        # Windows runner 默认 PowerShell, 这里统一用 Git Bash
        shell: bash
        run: |
          SCRIPT="${{ matrix.script_path }}"
          ARGS="${{ matrix.script_args }}"
          if [ -n "$ARGS" ]; then
            "./$SCRIPT" $ARGS
          else
            "./$SCRIPT"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ matrix.target }}
          path: pkg/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------
  # 收尾: 汇总 Flutter 产物, 创建/更新 GitHub Release
  # ----------------------------------------------------------
  release:
    name: GitHub Release
    needs: [resolve-version, flutter-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: flutter-*
          path: release-assets/
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          set -eu
          mkdir -p flat/
          find release-assets/ -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.dmg' -o -name '*.zip' -o -name '*.app' \) -exec cp {} flat/ \;
          echo "::group::Release 文件清单"
          ls -la flat/
          echo "::endgroup::"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.resolve-version.outputs.version, '-') }}
          files: flat/*
